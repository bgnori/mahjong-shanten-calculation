name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: mahjong-shanten-calculation
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bgnori/mahjong-domain-core
          ref: main
          path: mahjong-domain-core
      - name: Record tested revisions
        run: |
          for repository in mahjong-domain-core mahjong-shanten-calculation; do
            printf '%s: %s\n' "$repository" "$(git -C "$repository" rev-parse HEAD)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat lean-toolchain)"
        working-directory: mahjong-shanten-calculation
      - name: Fetch imported Mathlib cache
        run: |
          lake exe cache get $(find Shanten ../mahjong-domain-core/MahjongDomain -name '*.lean' \
            -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
        working-directory: mahjong-shanten-calculation
      - name: Build and reject proof holes
        run: lake build
        working-directory: mahjong-shanten-calculation

  shared-domain:
    name: Shared domain regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: mahjong-shanten-calculation
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bgnori/mahjong-domain-core
          ref: main
          path: mahjong-domain-core
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bgnori/mahjong-wait-classification
          ref: main
          path: mahjong-wait-classification
      - name: Record tested revisions
        run: |
          for repository in mahjong-domain-core mahjong-wait-classification mahjong-shanten-calculation; do
            printf '%s: %s\n' "$repository" "$(git -C "$repository" rev-parse HEAD)" \
              >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: elan toolchain install "$(cat mahjong-shanten-calculation/lean-toolchain)"
      - name: Verify shared glossary references
        run: |
          test -f mahjong-domain-core/docs/GLOSSARY.md
          grep -Fq \
            'https://github.com/bgnori/mahjong-domain-core/blob/main/docs/GLOSSARY.md' \
            mahjong-shanten-calculation/docs/GLOSSARY.md
          grep -Fq \
            'https://github.com/bgnori/mahjong-domain-core/blob/main/docs/GLOSSARY.md' \
            mahjong-wait-classification/docs/domain-vocabulary.md
      - name: Build shared domain core
        working-directory: mahjong-domain-core
        run: |
          lake exe cache get $(find MahjongDomain -name '*.lean' \
            -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
          lake build
      - name: Build shanten compatibility entrypoint
        working-directory: mahjong-shanten-calculation
        run: |
          lake exe cache get $(find Shanten ../mahjong-domain-core/MahjongDomain -name '*.lean' \
            -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
          lake build
      - name: Build classification compatibility entrypoint
        working-directory: mahjong-wait-classification
        run: |
          lake exe cache get $(find Mahjong MahjongTests ../mahjong-domain-core/MahjongDomain \
            -name '*.lean' -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
          lake build Mahjong MahjongTests
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: mahjong-wait-classification/go.mod
          cache: false
      - name: Test classification Go contract
        working-directory: mahjong-wait-classification
        run: go test ./mahjong
      - name: Build fixed-context connection and reject proof holes
        working-directory: mahjong-shanten-calculation/w6
        run: |
          lake exe cache get $(find ../Shanten ../../mahjong-wait-classification/Mahjong \
            ../../mahjong-domain-core/MahjongDomain SharedDomainW6.lean \
            -name '*.lean' -exec sed -n 's/^\(public \)\?import \(Mathlib\..*\)$/\2/p' {} + | sort -u)
          lake build
